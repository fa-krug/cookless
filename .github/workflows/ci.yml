name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/cookless

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: web/package-lock.json

    - name: Install dependencies
      run: cd web && npm ci

    - name: Run TypeScript check
      run: cd web && npm run typecheck

    - name: Run Vitest
      run: cd web && npm run test

  build-amd64:
    name: Build AMD64
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=-linux-amd64
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push AMD64
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./web
          file: ./web/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          provenance: false

  build-arm64:
    name: Build ARM64
    runs-on: ubuntu-24.04-arm
    needs: [test]
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=-linux-arm64
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push ARM64
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./web
          file: ./web/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/arm64
          provenance: false

  publish-manifest:
    name: Publish Multi-Arch Manifest
    runs-on: ubuntu-latest
    needs: [build-amd64, build-arm64]
    if: github.event_name == 'push'
    permissions:
      contents: read
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Create and push multi-arch manifest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "$TAGS" | while read -r tag; do
            if [ -z "$tag" ]; then continue; fi
            echo "Creating manifest for $tag"
            docker manifest create "$tag" \
              --amend "$tag-linux-amd64" \
              --amend "$tag-linux-arm64"
            docker manifest push "$tag"
          done

  deploy:
    name: Deploy to Arcane
    runs-on: ubuntu-latest
    needs: [publish-manifest]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # id-token: write lets the CLI swap this run's GitHub OIDC token for a
    # short-lived Arcane token (federated credential, Deployer role), so no
    # deploy secret is stored in the repo.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: getarcaneapp/setup-cli@v1
        with:
          version: 2.17.1
      - name: Redeploy Arcane project
        env:
          ARCANE_URL: https://arcane.fa-krug.de
          PROJECT: cookless
        run: |
          set -euo pipefail
          arcane-cli config set server-url "$ARCANE_URL"
          # </dev/null: the runner's stdin is a non-TTY, which makes the CLI try to
          # read a token from stdin instead of minting the GitHub OIDC token.
          eval "$(arcane-cli auth federated --audience "$ARCANE_URL" --export </dev/null)"
          echo "::add-mask::$ARCANE_TOKEN"
          # Pulls the new image and recreates the containers, streaming progress;
          # exits non-zero if the redeploy fails.
          arcane-cli projects redeploy "$PROJECT"
          arcane-cli projects get "$PROJECT"
      - name: Wait for health check
        run: |
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 -o /dev/null https://cookless.fa-krug.de/api/health; then echo "Healthy"; exit 0; fi
            sleep 10
          done
          echo "::error::https://cookless.fa-krug.de/api/health did not become healthy within 5 minutes"
          exit 1
