repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: bash -c 'cd backend && python3 -m mypy --config-file=../pyproject.toml .'
        language: system
        types: [python]
        pass_filenames: false
      - id: eslint
        name: eslint
        entry: bash -c 'cd frontend && npm run lint'
        language: system
        files: ^frontend/
        pass_filenames: false
      - id: tsc
        name: typescript
        entry: bash -c 'cd frontend && npx tsc -b'
        language: system
        files: ^frontend/
        pass_filenames: false
