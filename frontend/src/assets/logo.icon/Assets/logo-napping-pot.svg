<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Orange background with rounded corners (iOS-style) -->
  <rect width="512" height="512" rx="112" ry="112" fill="#f97316" />

  <g transform="translate(256, 256) scale(1.25) translate(-256, -309)">
    <!-- Pot body -->
    <path d="M 120 240
             L 120 310
             Q 120 430 256 430
             Q 392 430 392 310
             L 392 240
             Z"
          fill="#ffffff" />

    <!-- Left handle -->
    <rect x="80" y="260" width="40" height="20" rx="10" fill="#ffffff" />

    <!-- Right handle -->
    <rect x="392" y="260" width="40" height="20" rx="10" fill="#ffffff" />

    <!-- Lid base -->
    <ellipse cx="256" cy="238" rx="148" ry="22" fill="#e2e2e2" />

    <!-- Lid dome -->
    <path d="M 108 238
             Q 108 212 256 212
             Q 404 212 404 238
             Z"
          fill="#f0f0f0" />

    <!-- Lid knob -->
    <g transform="rotate(-12, 256, 195)">
      <rect x="241" y="188" width="30" height="24" rx="12" fill="#dedede" />
    </g>

    <!-- Sleeping face -->
    <!-- Left eye - closed, curved down -->
    <path d="M 180 315 Q 200 292 220 315" stroke="#f97316" stroke-width="9" stroke-linecap="round" fill="none" />
    <!-- Right eye - closed, curved down -->
    <path d="M 292 315 Q 312 292 332 315" stroke="#f97316" stroke-width="9" stroke-linecap="round" fill="none" />

    <!-- Content little smile -->
    <path d="M 215 365 Q 256 390 297 365" stroke="#f97316" stroke-width="8" stroke-linecap="round" fill="none" />

    <!-- Rosy cheeks -->
    <ellipse cx="175" cy="342" rx="22" ry="14" fill="#fdba74" opacity="0.5" />
    <ellipse cx="337" cy="342" rx="22" ry="14" fill="#fdba74" opacity="0.5" />
  </g>
</svg>