[project]
name = "cookless"
version = "0.1.0"
description = "Meal planning PWA with Django backend and React frontend"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [{name = "Stefan Krug"}]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "*.pyc",
    ".pytest_cache",
    "migrations",
    "staticfiles",
    "node_modules",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM", "C4", "DJ"]
ignore = ["E501"]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"migrations/*.py" = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["cookless", "recipes", "planner", "shopping", "users"]
section-order = ["future", "standard-library", "django", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
"django" = ["django"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.13"
check_untyped_defs = false
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "cookless.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "cookless.settings"
pythonpath = ["backend"]
testpaths = ["backend"]
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "--reuse-db"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
